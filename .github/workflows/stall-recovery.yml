name: stall-recovery

# Scheduled sweep: finds issues stuck at status:in-progress with no
# recent activity and recovers them. Never touches status:blocked,
# status:needs-human, status:on-hold, or status:waiting-on-lock --
# those are intentional pauses waiting on a human or a dependency,
# not accidental stalls.
#
# Heuristic for where to route a recovered issue: if the last comment
# named a specific hand-off target (e.g. "Handing off to
# `agent:test-engineer`") that differs from the current label, the
# hand-off almost certainly described an action that never actually
# executed -- route there directly rather than re-running the role
# that already finished its own turn. Otherwise, just retrigger the
# role currently holding the issue.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
    steps:
      - name: Find and recover stalled issues
        run: |
          NOW=$(date -u +%s)
          THRESHOLD_SECONDS=3600

          gh issue list --label "status:in-progress" --state open \
            --json number,labels,updatedAt --repo "${{ github.repository }}" \
            | jq -c '.[]' \
            | while read -r issue; do
                NUMBER=$(echo "$issue" | jq -r '.number')
                LABELS=$(echo "$issue" | jq -r '.labels[].name')
                AGENT_LABEL=$(echo "$LABELS" | grep '^agent:' || true)

                if [[ -z "$AGENT_LABEL" ]]; then
                  echo "Issue #$NUMBER: status:in-progress with no agent:* label -- not this sweep's problem, skipping."
                  continue
                fi

                LAST_COMMENT_TIME=$(gh issue view "$NUMBER" --json comments \
                  --repo "${{ github.repository }}" \
                  -q '.comments | if length > 0 then .[-1].createdAt else null end')
                if [[ -z "$LAST_COMMENT_TIME" || "$LAST_COMMENT_TIME" == "null" ]]; then
                  LAST_COMMENT_TIME=$(echo "$issue" | jq -r '.updatedAt')
                fi

                LAST_EPOCH=$(date -u -d "$LAST_COMMENT_TIME" +%s)
                AGE=$(( NOW - LAST_EPOCH ))

                if (( AGE < THRESHOLD_SECONDS )); then
                  continue
                fi

                echo "Issue #$NUMBER: no activity in $(( AGE / 60 ))m, currently $AGENT_LABEL -- recovering."

                LAST_COMMENT_BODY=$(gh issue view "$NUMBER" --json comments \
                  --repo "${{ github.repository }}" \
                  -q '.comments | if length > 0 then .[-1].body else "" end')

                TARGET=$(echo "$LAST_COMMENT_BODY" | grep -oE '`agent:[a-z-]+`' | tr -d '`' | tail -1 || true)

                if [[ -n "$TARGET" && "$TARGET" != "$AGENT_LABEL" ]]; then
                  gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
                    --body "Stall recovery: no activity for over an hour. The last comment named $TARGET as the hand-off target but the label never moved -- routing there directly rather than re-running $AGENT_LABEL."
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --remove-label "$AGENT_LABEL" --remove-label "status:in-progress"
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --add-label "$TARGET"
                else
                  gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
                    --body "Stall recovery: no activity for over an hour. Retriggering $AGENT_LABEL."
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --remove-label "status:in-progress"
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --remove-label "$AGENT_LABEL"
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --add-label "$AGENT_LABEL"
                fi
              done
