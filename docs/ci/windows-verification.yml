# Windows verification — executes the Windows/MSVC clauses this pipeline's
# Ubuntu agent runners cannot.
#
# ---------------------------------------------------------------------------
# THIS FILE IS THE MAINTAINED SOURCE. The ACTIVE copy is
#   .github/workflows/windows-verification.yml
# installed by the repository owner at fc23901 (2026-08-13). No agent in this
# pipeline can push under .github/workflows/ — the GitHub App does not declare
# the `workflows` permission, so this is permanent, not a settings toggle
# (docs/PROJECT_DEFINITION.md §7.1.1 V-10, docs/RTVM.md §9.1.4). A diff between
# this file and the installed one IS the pending-install queue (W-11).
#
# *** PENDING — NOT YET INSTALLED (staged 2026-08-13, docs/RTVM.md §9.1.5) ***
#   DW-1  the TP-905 step has never worked: `/ListTests:<arg>` takes the test
#         CONTAINER, not an output path, so vstest treated the output filename
#         as a second test source and exited 1. Split into two invocations.
#   DW-2  the summary could not say FAIL — rows keyed only on "did an output
#         file appear", so a step that ran and errored read as NOT-RUN. Now
#         keyed on each step's own outcome as well.
# Neither is urgent: TP-905 evidence can be produced today from
# tests/windows/run-procedures.ps1, which needs no permission (W-10). Batch
# these with any later change into ONE copy-and-commit rather than asking
# the owner twice (W-11).
# ---------------------------------------------------------------------------
#
# Design decisions W-1…W-8 and their reasons: docs/RTVM.md §9.1.3.
# Policy this serves (V-1…V-7): docs/PROJECT_DEFINITION.md §7.1.
#
# W-2 is the one to keep in mind when editing: this workflow PRODUCES
# EVIDENCE. It never issues a verdict, never sets a status:* or agent:*
# label, and never marks anything Verified. The Test Engineer reads its
# summary and artifact and rules. A green run is an input to a TP, not a pass.

name: windows-verification

on:
  push:
    branches:
      - main
      - "issue-*"
  workflow_dispatch: {}

# Read-only. This workflow must never relabel an issue or push a commit.
permissions:
  contents: read

concurrency:
  group: windows-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest # W-1. Also the §6.3 / §7 I-14 reference machine.
    timeout-minutes: 45

    env:
      SOLUTION: SudokuSolver.sln

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Record the machine (TP-500 requires the run to name it)
        shell: pwsh
        run: |
          $cs  = Get-CimInstance Win32_ComputerSystem
          $os  = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $lines = @(
            "| Property | Value |",
            "| --- | --- |",
            "| OS | $($os.Caption) $($os.Version) |",
            "| CPU | $($cpu.Name) |",
            "| Cores / logical | $($cpu.NumberOfCores) / $($cpu.NumberOfLogicalProcessors) |",
            "| Max clock (MHz) | $($cpu.MaxClockSpeed) |",
            "| RAM (GB) | $([math]::Round($cs.TotalPhysicalMemory / 1GB, 1)) |",
            "| Image | $env:ImageOS $env:ImageVersion |",
            "| Commit | $env:GITHUB_SHA |"
          )
          "## Verification machine`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $lines -join "`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $lines -join "`n" | Out-File evidence/machine.md

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: TP-900 / TP-901 — solution loads and builds (Debug|x64)
        shell: pwsh
        run: |
          # W-8: no /p: overrides beyond Configuration and Platform. This must
          # be the build the client's own engineer would get from the IDE.
          msbuild $env:SOLUTION /p:Configuration=Debug /p:Platform=x64 `
            /v:normal /fl "/flp:LogFile=evidence/build-debug.log;Verbosity=normal"

      - name: TP-900 / TP-901 / TP-906 — solution builds (Release|x64)
        shell: pwsh
        run: |
          msbuild $env:SOLUTION /p:Configuration=Release /p:Platform=x64 `
            /v:normal /fl "/flp:LogFile=evidence/build-release.log;Verbosity=normal"

      - name: Locate build outputs
        id: outputs
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter SudokuSolver.exe |
                 Where-Object { $_.FullName -match '\\(x64\\)?Release\\' } |
                 Select-Object -First 1
          $dll = Get-ChildItem -Recurse -Filter SudokuSolver.Tests.dll |
                 Where-Object { $_.FullName -match '\\(x64\\)?Release\\' } |
                 Select-Object -First 1
          if (-not $exe) { throw "Release SudokuSolver.exe not found after a successful build" }
          "exe=$($exe.FullName)" | Out-File -Append $env:GITHUB_OUTPUT
          if ($dll) { "testdll=$($dll.FullName)" | Out-File -Append $env:GITHUB_OUTPUT }

      - name: TP-905 — unit tests discovered and executed by vstest.console
        id: vstest
        shell: pwsh
        continue-on-error: true # W-6: a failure is evidence; later steps still run.
        run: |
          # vstest.console.exe is the engine Test Explorer drives; discovery
          # here is the substantive half of TP-905 (docs/RTVM.md §9.4 A-3).
          #
          # DW-1: /ListTests:<arg> takes the TEST CONTAINER as its argument, not
          # an output path, and cannot be combined with an execution run. Two
          # invocations, discovery first, each redirected to its own evidence
          # file. The original one-line form exited 1 on every run since
          # fc23901 and produced no evidence at all.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -property installationPath
          $vstest = Join-Path $vs "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
          $dll = "${{ steps.outputs.outputs.testdll }}"

          & $vstest /ListTests:"$dll" /Platform:x64 |
            Tee-Object evidence/discovered-tests.txt
          $listExit = $LASTEXITCODE

          & $vstest "$dll" /Platform:x64 /Logger:"trx;LogFileName=tests.trx" `
            /ResultsDirectory:"$PWD\evidence" |
            Tee-Object evidence/vstest-run.txt
          $runExit = $LASTEXITCODE

          "discovery exit $listExit / execution exit $runExit" |
            Tee-Object -Append evidence/vstest-run.txt
          if ($listExit -ne 0 -or $runExit -ne 0) { exit 1 }

      - name: TP-506 — import table of the delivered executable (dumpbin clause)
        id: dumpbin
        shell: pwsh
        continue-on-error: true
        run: |
          # The clean-machine launch clause of TP-506 cannot run here — every
          # hosted image ships the VC++ runtimes (docs/RTVM.md §9.4 A-1). This
          # is TP-506's own dumpbin clause, which CAN run: expect stock system
          # DLLs only, and no MSVCP140 / VCRUNTIME140*.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Import-Module (Join-Path $vs "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64'
          dumpbin /dependents "${{ steps.outputs.outputs.exe }}" |
            Tee-Object evidence/dumpbin-dependents.txt

      - name: TP-001…TP-009, TP-3xx, TP-4xx, TP-505 — runtime procedures
        id: runtime
        shell: pwsh
        continue-on-error: true
        run: |
          # Owned by the Test Engineer, not by this workflow: the procedure
          # scripts live in tests/windows/ so they can be added and revised
          # without a workflows-permission round trip. Absent = NOT-RUN, not
          # pass (V-6).
          if (Test-Path tests/windows/run-procedures.ps1) {
            & pwsh tests/windows/run-procedures.ps1 `
              -Exe "${{ steps.outputs.outputs.exe }}" `
              -EvidenceDir "$PWD\evidence"
          } else {
            "tests/windows/run-procedures.ps1 not present - runtime procedures NOT-RUN" |
              Tee-Object evidence/runtime-procedures.txt
          }

      - name: TP-500…TP-504 — timing set, Release only, three samples (W-7)
        id: timing
        shell: pwsh
        continue-on-error: true
        run: |
          # Three samples, all reported. Never retried until green: §7 I-6's
          # +/-1.0 s is the tolerance, and hiding jitter would make TP-501/502
          # meaningless (docs/RTVM.md §9.1.3 W-7).
          if (Test-Path tests/windows/run-timing.ps1) {
            foreach ($i in 1..3) {
              & pwsh tests/windows/run-timing.ps1 `
                -Exe "${{ steps.outputs.outputs.exe }}" `
                -EvidenceDir "$PWD\evidence" -Sample $i
            }
          } else {
            "tests/windows/run-timing.ps1 not present - timing set NOT-RUN" |
              Tee-Object evidence/timing.txt
          }

      - name: Summarise by TP id
        if: always()
        shell: pwsh
        run: |
          # Deliberately mechanical: EXECUTED/FAILED/NOT-RUN per procedure,
          # keyed by TP id so the log is greppable (W-4, W-5). It states what
          # ran. It does not state that a requirement is verified - that is the
          # Test Engineer's call (W-2).
          #
          # DW-2: a row must distinguish "the step ran and errored" from "the
          # step never ran". Keying only on whether an output file appeared
          # collapsed those two into NOT-RUN, which is how a broken vstest step
          # read as a tidy absence for two runs. Each row now carries the
          # step's own outcome as well as its evidence file.
          $rows = @(
            @{ tp = "TP-900/901 (build)"; file = "evidence/build-release.log";      outcome = "success" },
            @{ tp = "TP-905 (vstest)";    file = "evidence/discovered-tests.txt";   outcome = "${{ steps.vstest.outcome }}" },
            @{ tp = "TP-506 (dumpbin)";   file = "evidence/dumpbin-dependents.txt"; outcome = "${{ steps.dumpbin.outcome }}" },
            @{ tp = "TP-0xx/4xx/505";     file = "evidence/runtime-procedures.json"; outcome = "${{ steps.runtime.outcome }}" },
            @{ tp = "TP-500..504";        file = "evidence/timing.json";            outcome = "${{ steps.timing.outcome }}" }
          )
          "## Clause coverage this run`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| Procedure | State | Step outcome |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| --- | --- | --- |"                  | Out-File -Append $env:GITHUB_STEP_SUMMARY
          foreach ($r in $rows) {
            $state =
              if ($r.outcome -eq "failure")  { "**FAILED - step errored, read the log**" }
              elseif (Test-Path $r.file)     { "executed - see artifact" }
              else                           { "NOT-RUN" }
            "| $($r.tp) | $state | $($r.outcome) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }
          "`n_Evidence only. Verdicts are the Test Engineer's (docs/RTVM.md §9.1.3 W-2)._" |
            Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn
